apiVersion: apps/v1
kind: Deployment
metadata:
  name: basicphp-deployment
  labels:
    app: basicphp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: basicphp
  template:
    metadata:
      labels:
        app: basicphp
    spec:
      containers:
        - name: basicphp
          # Jenkins will replace IMAGE_PLACEHOLDER with actual image (user/repo:tag)
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
